server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    
    # Gzip compression
    gzip on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml text/markdown;
    
    # Service Worker: Must never be cached by browser
    location = /sw.js {
        default_type application/javascript;
        add_header Content-Type "application/javascript; charset=utf-8";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # AI Agent / LLM discovery files
    location = /llms.txt {
        types { text/markdown txt; }
        default_type text/markdown;
        add_header Content-Type "text/markdown; charset=utf-8";
        add_header Cache-Control "public, max-age=86400";
    }

    location = /llms-full.txt {
        types { text/markdown txt; }
        default_type text/markdown;
        add_header Content-Type "text/markdown; charset=utf-8";
        add_header Cache-Control "public, max-age=86400";
    }

    # Sitemap & Search Engine discovery files
    location = /sitemap.xml {
        default_type application/xml;
        add_header Content-Type "application/xml; charset=utf-8";
        add_header Cache-Control "public, max-age=86400";
    }

    location = /robots.txt {
        default_type text/plain;
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=86400";
    }

    # Cache immutable static assets with hash in filename
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|woff|woff2|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router: All routes → index.html (never cache index.html)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
