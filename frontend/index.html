      .nav-links{flex:1;display:flex!important;justify-content:center!important;gap:2rem!important;align-items:center!important;list-style:none!important;margin:0!important;padding:0!important}

      .hero-centered{position:relative;padding:160px 0 100px;background:linear-gradient(135deg,var(--color-accent-maroon) 0%,var(--color-secondary) 55%,var(--color-primary-orange) 100%);color:var(--color-white);overflow:hidden}
      .hero-grid-wrap{display:grid;grid-template-columns:1.2fr 0.8fr;gap:3rem;align-items:center}
      .hero-text-wrap{z-index:2}
      .hero-title{font-size:clamp(2.2rem,5vw,3.5rem);font-weight:800;color:var(--color-white);line-height:1.2;margin-bottom:1.5rem}
