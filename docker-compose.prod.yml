version: '3.9'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=/api/v1
    container_name: sempoa_frontend_prod
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - sempoa-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sempoa_backend_prod
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sempoa_prod}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-sempoa_sip}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - FASTAPI_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - ESP32_API_KEY=${ESP32_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ALLOWED_ORIGINS=https://sempoasippariaman.com,https://www.sempoasippariaman.com,http://202.155.157.22,https://202.155.157.22
      - GOOGLE_WEBHOOK_URL=https://script.google.com/macros/s/AKfycbxvnOx98V0kyz_ifxqM_Dp_i3m3TPrqdKCo9DBJcubP9qKGG_AM9ewVap0RpUxEVJw4/exec
    volumes:
      - ./backend/app/uploads:/app/app/uploads
      - ./backend/backups:/app/backups
    depends_on:
      - db
      - redis
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - sempoa-network

  redis:
    image: redis:7-alpine
    container_name: sempoa_redis_prod
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - sempoa-network

  db:
    image: postgres:15-alpine
    container_name: sempoa_db_prod
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50", "-c", "work_mem=4MB"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sempoa_prod}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-sempoa_sip}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - sempoa-network

  nginx:
    image: nginx:alpine
    container_name: sempoa_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - sempoa-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  sempoa-network:
    driver: bridge
