version: '3.9'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: sempoa_frontend_prod
    environment:
      - VITE_API_URL=https://sempoasipariaman.com/api
    restart: unless-stopped
    networks:
      - sempoa-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sempoa_backend_prod
    environment:
      - DATABASE_URL=postgresql://sempoa_user:${POSTGRES_PASSWORD}@db:5432/sempoa_prod
      - ENVIRONMENT=production
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - sempoa-network

  db:
    image: postgres:15-alpine
    container_name: sempoa_db_prod
    environment:
      - POSTGRES_USER=sempoa_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=sempoa_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - sempoa-network

  nginx:
    image: nginx:alpine
    container_name: sempoa_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - sempoa-network

volumes:
  postgres_data:
    driver: local

networks:
  sempoa-network:
    driver: bridge
