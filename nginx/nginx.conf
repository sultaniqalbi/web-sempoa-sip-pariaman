# Optimizations for high traffic (1M users/day)
gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types application/javascript application/json application/xml text/css text/plain text/javascript text/xml image/svg+xml;


upstream frontend {
    server frontend:80;
    keepalive 32;
}

upstream backend {
    server backend:8000;
    keepalive 32;
}

# HTTP - Redirect all traffic to HTTPS non-www and support Certbot challenge
server {
    listen 80;
    server_name sempoasippariaman.com www.sempoasippariaman.com 202.155.157.22;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS non-www
    location / {
        return 301 https://sempoasippariaman.com$request_uri;
    }
}

# HTTPS - Redirect www to non-www
server {
    listen 443 ssl http2;
    server_name www.sempoasippariaman.com;

    # SSL Certificates from Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/sempoasippariaman.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sempoasippariaman.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/sempoasippariaman.com/fullchain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    return 301 https://sempoasippariaman.com$request_uri;
}

# HTTPS - Main Production Server
server {
    listen 443 ssl http2;
    server_name sempoasippariaman.com;

    # SSL Certificates from Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/sempoasippariaman.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sempoasippariaman.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/sempoasippariaman.com/fullchain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # Protection against slow connections (Slow-Loris)
    client_body_timeout 12s;
    client_header_timeout 12s;
    keepalive_timeout 65s;
    send_timeout 10s;

    # Security & Server Hardening Headers
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https: wss: ws:; frame-src 'self' https://www.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # Max upload size (photos, bukti transfer, gallery)
    client_max_body_size 50M;

    # Frontend React SPA
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API & Hardware API (with Realtime WebSocket support)
    location /api {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Static uploads (profile photos, gallery, payment receipts)
    location /uploads {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Health check
    location /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
